name: Build FaceSwap Pro Neural v2

on:
  push:
    branches:
      - feature/neural-v2-native
      - fix/neural-v2-fastload-v203
      - feature/cloud-turbo-v3
    paths:
      - 'neural_v2/**'
      - 'cloud_turbo/**'
      - '.github/workflows/build_neural_v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-neural-arm64:
    name: Native neural ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out FaceSwapPro patch layer
        uses: actions/checkout@v4

      - name: Validate Turbo service source
        shell: bash
        run: |
          python -m py_compile cloud_turbo/server.py
          grep -q '/v1/video-swap' cloud_turbo/server.py
          grep -q 'tensorrt' cloud_turbo/server.py
          grep -q 'h264_nvenc' cloud_turbo/server.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Use runner Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android 36 + NDK 28.2
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'

      - name: Fetch pinned MIT native neural chassis
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/Parasaran-Python/android-face-fusion.git neural-upstream
          cd neural-upstream
          git checkout d5672622e53a97b04a158440a507126f384964ac
          test "$(git rev-parse HEAD)" = 'd5672622e53a97b04a158440a507126f384964ac'

      - name: Apply Omega Cloud Turbo stack
        shell: bash
        run: |
          python neural_v2/apply_omega_v2.py neural-upstream
          sed -i 's/version = release(37)/version = release(36)/' neural-upstream/app/build.gradle.kts
          sed -i 's/glide = "5.0.9"/glide = "4.16.0"/' neural-upstream/gradle/libs.versions.toml
          python - <<'PY'
          from pathlib import Path
          p = Path('neural-upstream/app/src/main/java/com/pv/androidfacefusion/OmegaPixelBoost.java')
          s = p.read_text()
          s = s.replace('import android.util.Log;\n', 'import android.util.Log;\nimport ai.onnxruntime.OrtException;\n', 1)
          s = s.replace('Bitmap targetImage) {', 'Bitmap targetImage) throws OrtException {', 1)
          s = s.replace('Bitmap targetImage, int phases) {', 'Bitmap targetImage, int phases) throws OrtException {', 1)
          if s.count('throws OrtException') != 2:
              raise SystemExit('OrtException propagation patch failed')
          p.write_text(s)
          PY
          python neural_v2/apply_video_v2.py neural-upstream
          python neural_v2/apply_video_perf_v22.py neural-upstream
          python neural_v2/apply_fastload_v203.py neural-upstream
          python neural_v2/apply_cloud_turbo_v3.py neural-upstream

          grep -q 'version = release(36)' neural-upstream/app/build.gradle.kts
          grep -q 'targetSdk = 36' neural-upstream/app/build.gradle.kts
          grep -q 'versionCode = 30001' neural-upstream/app/build.gradle.kts
          grep -q 'versionName = "3.0.0-alpha-cloud-turbo"' neural-upstream/app/build.gradle.kts
          grep -q 'Turbo Cloud GPU' neural-upstream/app/src/main/java/com/pv/androidfacefusion/VideoSwapActivity.java
          grep -q 'Local Private' neural-upstream/app/src/main/java/com/pv/androidfacefusion/VideoSwapActivity.java
          grep -q '/v1/video-swap' neural-upstream/app/src/main/java/com/pv/androidfacefusion/CloudTurboClient.java
          grep -q 'w600k_mbf.onnx' neural-upstream/app/src/main/java/com/pv/androidfacefusion/FaceEmbedder.java
          grep -q 'inswapper_128_fp16.onnx' neural-upstream/app/src/main/java/com/pv/androidfacefusion/FaceSwapper.java
          ! python - <<'PY'
          from pathlib import Path
          s=Path('neural-upstream/app/src/main/java/com/pv/androidfacefusion/VideoSwapActivity.java').read_text()
          x=s[s.index('protected void onCreate'):s.index('private void buildUi')]
          raise SystemExit(0 if 'warmModels();' in x else 1)
          PY

      - name: Build native neural APK
        working-directory: neural-upstream
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify ARM64 Cloud Turbo package
        shell: bash
        run: |
          set -euo pipefail
          APK='neural-upstream/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          mkdir -p dist
          OUT='dist/FaceSwapPro-v3.0.0-Cloud-Turbo-arm64.apk'
          cp "$APK" "$OUT"
          unzip -l "$OUT" | grep -q 'lib/arm64-v8a/'
          unzip -Z1 "$OUT" | grep -q '^classes.*\.dex$'
          FOUND=0
          while read -r dex; do
            if unzip -p "$OUT" "$dex" | strings | grep -q 'CloudTurboClient'; then FOUND=1; break; fi
          done < <(unzip -Z1 "$OUT" | grep '^classes.*\.dex$')
          test "$FOUND" = 1
          if unzip -l "$OUT" | grep -q 'lib/x86_64/'; then
            echo 'Unexpected x86_64 native libraries packaged' >&2
            exit 1
          fi
          sha256sum "$OUT" | tee dist/APK_SHA256.txt
          ls -lh "$OUT"

      - name: Upload installable Cloud Turbo APK
        uses: actions/upload-artifact@v4
        with:
          name: FaceSwapPro-v3.0.0-Cloud-Turbo-arm64
          path: |
            dist/FaceSwapPro-v3.0.0-Cloud-Turbo-arm64.apk
            dist/APK_SHA256.txt
          if-no-files-found: error
          retention-days: 30

name: Build and publish FaceSwap Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - install-ready
      - apk-build
      - 'fix/**'
  pull_request:
    branches:
      - master
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

env:
  APK_RELEASE_TAG: faceswappro-latest
  APK_RELEASE_NAME: FaceSwap Pro Latest APK

concurrency:
  group: faceswappro-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile ARM64 Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Android build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant autoconf automake autopoint build-essential ccache cmake gettext git \
            lbzip2 libffi-dev libltdl-dev libncurses5-dev libncursesw5-dev \
            libssl-dev libtool patch pkg-config python3-dev unzip wget zip zlib1g-dev

      - name: Install Buildozer toolchain
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'buildozer==1.6.0'
          buildozer --version

      - name: Bundle OpenCV face detector
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/opencv/opencv/4.12.0/data/haarcascades/haarcascade_frontalface_alt2.xml \
            --output assets/haarcascade_frontalface_alt2.xml
          test -s assets/haarcascade_frontalface_alt2.xml

      - name: Validate repaired source
        run: |
          python -m py_compile main.py faceswap.py faceswap/__init__.py
          grep -q 'def process_video' faceswap.py
          grep -q 'libffmpegbin.so' faceswap/__init__.py
          grep -q 'TemporaryFile' faceswap/__init__.py
          grep -q 'requirements = .*opencv.*ffmpeg.*av_codecs' buildozer.spec
          grep -q 'p4a.branch = v2026.05.09' buildozer.spec
          grep -q 'android.api = 36' buildozer.spec
          grep -q 'android.ndk = 28c' buildozer.spec
          grep -q '"libx264"' faceswap.py

      - name: Build debug APK
        env:
          USE_CCACHE: '1'
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          yes | buildozer -v android debug

      - name: Verify and name generated APK
        run: |
          APK="$(find bin -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | grep -q 'libffmpegbin.so'
          cp "$APK" FaceSwapPro-v1.3.1-expression-aware-arm64.apk
          ls -lh FaceSwapPro-v1.3.1-expression-aware-arm64.apk
          sha256sum FaceSwapPro-v1.3.1-expression-aware-arm64.apk | tee APK_SHA256.txt

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceSwapPro-v1.3.1-expression-aware-arm64
          path: |
            FaceSwapPro-v1.3.1-expression-aware-arm64.apk
            APK_SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish public latest APK release
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$APK_RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$APK_RELEASE_TAG" \
              FaceSwapPro-v1.3.1-expression-aware-arm64.apk APK_SHA256.txt \
              --clobber
            gh release edit "$APK_RELEASE_TAG" \
              --title "$APK_RELEASE_NAME" \
              --notes 'Expression-aware Android build with mouth, eye, eyebrow, cheek and jaw motion, Android-safe FFmpeg launch, audio preservation, and repaired video saving.' \
              --latest
          else
            gh release create "$APK_RELEASE_TAG" \
              FaceSwapPro-v1.3.1-expression-aware-arm64.apk APK_SHA256.txt \
              --title "$APK_RELEASE_NAME" \
              --notes 'Expression-aware Android build with mouth, eye, eyebrow, cheek and jaw motion, Android-safe FFmpeg launch, audio preservation, and repaired video saving.' \
              --latest
          fi

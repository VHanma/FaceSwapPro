name: Build Ultimate Video Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'
      - 'ultimate/**'
  pull_request:
    branches:
      - master

permissions:
  contents: write

env:
  APK_FILE: UltimateVideoStudio-v2.3.0-arm64.apk
  SOURCE_FILE: UltimateVideoStudio-v2.3-source.zip
  PREVIEW_TAG: ultimate-video-studio-v2-preview
  PREVIEW_NAME: Ultimate Video Studio v2.3 Live Preview

concurrency:
  group: ultimate-video-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Ultimate Video Studio ARM64 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Expand checksummed Ultimate Video Studio v2.3 source
        run: |
          cat v23p0 v23p1 v23p2 v23p3 v23p4 v23p5 v23p6 v23p7 > /tmp/uvs_payload.b64
          echo '4da2abd3d88000de61369ecd4546f0fa7a0cd8e8476e8c0746497c17cfa3b213  /tmp/uvs_payload.b64' | sha256sum -c -
          base64 -d /tmp/uvs_payload.b64 > /tmp/uvs_payload.zip
          echo '8a74349bac060acde849470f93897668e49808558e5970260e4812f92f9875cb  /tmp/uvs_payload.zip' | sha256sum -c -
          unzip -o /tmp/uvs_payload.zip -d .
          test -s main.py
          test -s editor_engine.py
          test -s face_temporal.py
          test -s buildozer.spec

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Android build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant autoconf automake autopoint build-essential ccache cmake gettext git \
            lbzip2 libffi-dev libltdl-dev libncurses5-dev libncursesw5-dev \
            libssl-dev libtool patch pkg-config python3-dev unzip wget zip zlib1g-dev

      - name: Install Buildozer and host test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'buildozer==1.6.0' 'numpy<2.3' 'opencv-python-headless==4.12.0.88'
          buildozer --version
          python - <<'PY'
          import cv2, numpy
          print('Host OpenCV', cv2.__version__, 'NumPy', numpy.__version__)
          assert cv2.__version__.startswith('4.12.'), cv2.__version__
          assert hasattr(cv2, 'CascadeClassifier')
          assert hasattr(cv2, 'calcOpticalFlowPyrLK')
          assert hasattr(cv2, 'estimateAffinePartial2D')
          PY

      - name: Bundle OpenCV face detector
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/opencv/opencv/4.12.0/data/haarcascades/haarcascade_frontalface_alt2.xml \
            --output assets/haarcascade_frontalface_alt2.xml
          test -s assets/haarcascade_frontalface_alt2.xml

      - name: Prepare collision-free face engine
        run: |
          cp faceswap.py faceswap_engine.py
          test -s faceswap_engine.py

      - name: Rival gate - validate v2.3 source
        run: |
          python -m py_compile main.py editor_engine.py face_temporal.py faceswap_engine.py faceswap/__init__.py
          grep -q 'class UltimateVideoStudioApp' main.py
          grep -q 'LIVE PREVIEW' main.py
          grep -q 'def _live_render_worker' main.py
          grep -q 'def render_preview_frame' editor_engine.py
          grep -q 'def prepare_preview_frame' editor_engine.py
          grep -q 'def generate_motion_track' editor_engine.py
          grep -q 'calcOpticalFlowPyrLK' editor_engine.py
          grep -q 'estimateAffinePartial2D' editor_engine.py
          grep -q 'blend_mode' editor_engine.py
          grep -q 'class TemporalFaceSwapper' face_temporal.py
          grep -q '^version = 2.3.0' buildozer.spec
          grep -q 'requirements = .*opencv.*ffmpeg.*av_codecs' buildozer.spec
          grep -q 'android.api = 36' buildozer.spec
          grep -q 'android.ndk = 28c' buildozer.spec
          grep -q 'p4a.branch = v2026.05.09' buildozer.spec
          grep -q 'libffmpegbin.so' faceswap/__init__.py
          grep -q '"libx264"' faceswap_engine.py

      - name: Rival gate - live preview compositor
        run: |
          python - <<'PY'
          import cv2
          import numpy as np
          from editor_engine import EditSettings, Keyframe, OverlayTrack, render_preview_frame
          frame = np.full((360, 640, 3), 70, np.uint8)
          cv2.rectangle(frame, (170, 55), (470, 330), (40, 150, 220), -1)
          track = OverlayTrack(kind='text', text='LIVE', blend_mode='Screen', keyframes=[
              Keyframe(time=0.0, x=0.2, y=0.3, scale=0.2, opacity=0.7, rotation=0.0),
              Keyframe(time=2.0, x=0.8, y=0.7, scale=0.4, opacity=1.0, rotation=50.0),
          ])
          settings = EditSettings(preset='Vivid', brightness=0.04, contrast=1.08, saturation=1.15, overlay_tracks=[track])
          out = render_preview_frame(frame, settings, 1.0, max_width=540)
          assert out.shape[1] == 540, out.shape
          baseline = cv2.resize(frame, (540, out.shape[0]))
          assert float(np.mean(np.abs(out.astype(np.int16) - baseline.astype(np.int16)))) > 1.0
          print('LIVE_PREVIEW_GATE_OK', out.shape, float(out.mean()))
          PY

      - name: Rival gate - Cinema face temporal stability
        run: |
          python - <<'PY'
          import numpy as np
          from face_temporal import TemporalFaceSwapper
          t = np.linspace(0.0, 1.0, 45, dtype=np.float32)
          base = np.column_stack((80.0 + 150.0*t, 120.0 + 35.0*np.sin(t*5.0))).astype(np.float32)
          swapper = TemporalFaceSwapper(detection_width=640, quality='Cinema')
          first = swapper._smooth_target_points(base, (55, 55, 220, 250))
          measured = base + np.array([4.0, 3.0], dtype=np.float32)
          measured[5] += np.array([120.0, -80.0], dtype=np.float32)
          measured[40] += np.array([0.0, 18.0], dtype=np.float32)
          second = swapper._smooth_target_points(measured, (59, 58, 220, 250))
          rejected = float(np.linalg.norm(second[5] - measured[5]))
          expression = float(second[40, 1] - first[40, 1])
          assert rejected > 45.0, rejected
          assert expression > 5.0, expression
          print('Cinema temporal gate OK:', rejected, expression)
          PY

      - name: Build debug APK
        env:
          USE_CCACHE: '1'
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          yes | buildozer -v android debug

      - name: Verify and name generated APK
        run: |
          APK="$(find bin -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | grep -q 'libffmpegbin.so'
          cp "$APK" "$APK_FILE"
          ls -lh "$APK_FILE"
          sha256sum "$APK_FILE" | tee APK_SHA256.txt
          zip -9 "$SOURCE_FILE" main.py editor_engine.py face_temporal.py buildozer.spec

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltimateVideoStudio-v2.3.0-arm64
          path: |
            ${{ env.APK_FILE }}
            APK_SHA256.txt
            ${{ env.SOURCE_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish branch preview APK release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES='Ultimate Video Studio v2.3 replaces blind batch-style editing with a persistent live viewer. It adds play/pause, exact-frame stepping, scrubbing, live update coalescing, Fast/Balanced/Sharp preview quality, live geometry/color/preset/text/sticker/background/timeline compositing, and live Cinema face preview while keeping full-resolution export separate from preview resolution. v2.2 editable auto tracking, blend modes, Smart Cutout v2 and Cinema temporal face stabilization remain.'
          if gh release view "$PREVIEW_TAG" >/dev/null 2>&1; then
            gh release upload "$PREVIEW_TAG" "$APK_FILE" APK_SHA256.txt "$SOURCE_FILE" --clobber
            gh release edit "$PREVIEW_TAG" --title "$PREVIEW_NAME" --notes "$NOTES" --prerelease
          else
            gh release create "$PREVIEW_TAG" "$APK_FILE" APK_SHA256.txt "$SOURCE_FILE" \
              --title "$PREVIEW_NAME" --notes "$NOTES" --prerelease \
              --target "${GITHUB_SHA}"
          fi

name: Build Ultimate Video Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'
      - 'ultimate/**'
  pull_request:
    branches:
      - master

permissions:
  contents: write

env:
  APK_FILE: UltimateVideoStudio-v2.0.0-arm64.apk
  PREVIEW_TAG: ultimate-video-studio-v2-preview
  PREVIEW_NAME: Ultimate Video Studio v2 Preview

concurrency:
  group: ultimate-video-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Ultimate Video Studio ARM64 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Expand Ultimate Video Studio source payload
        run: |
          cat uvs_payload.part* > /tmp/uvs_payload.b64
          test -s /tmp/uvs_payload.b64
          base64 -d /tmp/uvs_payload.b64 > /tmp/uvs_payload.zip
          unzip -o /tmp/uvs_payload.zip -d .
          test -s main.py
          test -s editor_engine.py
          test -s buildozer.spec

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Android build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant autoconf automake autopoint build-essential ccache cmake gettext git \
            lbzip2 libffi-dev libltdl-dev libncurses5-dev libncursesw5-dev \
            libssl-dev libtool patch pkg-config python3-dev unzip wget zip zlib1g-dev

      - name: Install Buildozer toolchain
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'buildozer==1.6.0'
          buildozer --version

      - name: Bundle OpenCV face detector
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/opencv/opencv/4.12.0/data/haarcascades/haarcascade_frontalface_alt2.xml \
            --output assets/haarcascade_frontalface_alt2.xml
          test -s assets/haarcascade_frontalface_alt2.xml

      - name: Prepare collision-free face engine
        run: |
          cp faceswap.py faceswap_engine.py
          test -s faceswap_engine.py

      - name: Validate editor source
        run: |
          python -m py_compile main.py editor_engine.py faceswap_engine.py faceswap/__init__.py
          grep -q 'class UltimateVideoStudioApp' main.py
          grep -q 'def render_project' editor_engine.py
          grep -q 'def face_swap_frame' editor_engine.py
          grep -q 'def auto_cutout_background' editor_engine.py
          grep -q 'requirements = .*opencv.*ffmpeg.*av_codecs' buildozer.spec
          grep -q 'android.api = 36' buildozer.spec
          grep -q 'android.ndk = 28c' buildozer.spec
          grep -q 'p4a.branch = v2026.05.09' buildozer.spec
          grep -q 'libffmpegbin.so' faceswap/__init__.py
          grep -q '"libx264"' faceswap_engine.py

      - name: Build debug APK
        env:
          USE_CCACHE: '1'
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          yes | buildozer -v android debug

      - name: Verify and name generated APK
        run: |
          APK="$(find bin -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | grep -q 'libffmpegbin.so'
          cp "$APK" "$APK_FILE"
          ls -lh "$APK_FILE"
          sha256sum "$APK_FILE" | tee APK_SHA256.txt
          zip -9 UltimateVideoStudio-v2-source.zip main.py editor_engine.py buildozer.spec

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltimateVideoStudio-v2.0.0-arm64
          path: |
            ${{ env.APK_FILE }}
            APK_SHA256.txt
            UltimateVideoStudio-v2-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish branch preview APK release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES='Ultimate Video Studio v2 preview: full Android editor foundation with trim/speed/reverse, smooth slow motion, stabilization, frame-by-frame overrides, expression-aware face swapping, color/effects, text, custom stickers, background replacement, audio processing, and configurable H.264/H.265 export.'
          if gh release view "$PREVIEW_TAG" >/dev/null 2>&1; then
            gh release upload "$PREVIEW_TAG" "$APK_FILE" APK_SHA256.txt UltimateVideoStudio-v2-source.zip --clobber
            gh release edit "$PREVIEW_TAG" --title "$PREVIEW_NAME" --notes "$NOTES" --prerelease
          else
            gh release create "$PREVIEW_TAG" "$APK_FILE" APK_SHA256.txt UltimateVideoStudio-v2-source.zip \
              --title "$PREVIEW_NAME" --notes "$NOTES" --prerelease \
              --target "${GITHUB_SHA}"
          fi

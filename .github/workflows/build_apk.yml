name: Build FaceSwap Pro APEX APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - install-ready
      - apk-build
      - 'fix/**'
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: faceswappro-apex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile APEX ARM64 Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Android build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant autoconf automake autopoint build-essential ccache cmake gettext git \
            lbzip2 libffi-dev libltdl-dev libncurses5-dev libncursesw5-dev \
            libssl-dev libtool patch pkg-config python3-dev unzip wget zip zlib1g-dev

      - name: Install Buildozer toolchain
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'buildozer==1.6.0'
          buildozer --version

      - name: Bundle legacy detector fallback
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/opencv/opencv/4.12.0/data/haarcascades/haarcascade_frontalface_alt2.xml \
            --output assets/haarcascade_frontalface_alt2.xml
          test -s assets/haarcascade_frontalface_alt2.xml

      - name: Prepare proven FFmpeg engine base
        run: |
          cp faceswap.py faceswap_engine.py
          test -s faceswap_engine.py

      - name: Validate APEX neural source
        run: |
          python -m py_compile \
            main.py faceswap_engine.py faceswap/__init__.py \
            apex_models.py apex_ort.py apex_engine.py
          grep -q 'class ApexFaceSwapper' apex_engine.py
          grep -q 'ghost_1_256.onnx' apex_models.py
          grep -q 'bisenet_resnet_18.onnx' apex_models.py
          grep -q 'gfpgan_1.4.onnx' apex_models.py
          grep -q 'onnxruntime-android:1.27.0' buildozer.spec
          grep -q 'android.add_src = java_src' buildozer.spec
          grep -q 'android.permissions = INTERNET' buildozer.spec
          grep -q 'class ApexOrtBridge' java_src/org/vaan/faceswap/apex/ApexOrtBridge.java
          grep -q 'libffmpegbin.so' faceswap/__init__.py
          grep -q 'TemporaryFile' faceswap/__init__.py
          grep -q 'p4a.branch = v2026.05.09' buildozer.spec
          grep -q 'android.api = 36' buildozer.spec
          grep -q 'android.ndk = 28c' buildozer.spec

      - name: Build APEX debug APK
        env:
          USE_CCACHE: '1'
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          yes | buildozer -v android debug

      - name: Verify neural runtime and package
        run: |
          APK="$(find bin -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | grep -q 'libffmpegbin.so'
          unzip -l "$APK" | grep -q 'ApexOrtBridge'
          unzip -l "$APK" | grep -Eq 'libonnxruntime|onnxruntime'
          cp "$APK" FaceSwapPro-APEX-v2.0.0-arm64.apk
          ls -lh FaceSwapPro-APEX-v2.0.0-arm64.apk
          sha256sum FaceSwapPro-APEX-v2.0.0-arm64.apk | tee APK_SHA256.txt

      - name: Upload APEX installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FaceSwapPro-APEX-v2.0.0-arm64
          path: |
            FaceSwapPro-APEX-v2.0.0-arm64.apk
            APK_SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish APEX latest release
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='faceswappro-apex-latest'
          NOTES='APEX v2 neural architecture: GHOST 256 identity transfer, YuNet five-point alignment, BiSeNet semantic face masks, temporal anti-flicker, target relighting, optional GFPGAN 512 restoration, NNAPI/ONNX Runtime Android inference, and local media processing.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" FaceSwapPro-APEX-v2.0.0-arm64.apk APK_SHA256.txt --clobber
            gh release edit "$TAG" --title 'FaceSwap Pro APEX Latest' --notes "$NOTES" --latest
          else
            gh release create "$TAG" FaceSwapPro-APEX-v2.0.0-arm64.apk APK_SHA256.txt \
              --title 'FaceSwap Pro APEX Latest' --notes "$NOTES" --latest
          fi

name: Temporary OmniScribe APK Builder

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  BUILD_ISSUE_TITLE: '[CI] Build OmniScribe v1.1 arm64'
  RELEASE_TAG: omniscribe-v1.1-ci

jobs:
  build:
    if: github.event.issue.title == '[CI] Build OmniScribe v1.1 arm64'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out isolated OmniScribe build branch
        uses: actions/checkout@v4
        with:
          ref: build/omniscribe-v1.1

      - name: Reconstruct OmniScribe source
        shell: bash
        run: |
          set -euo pipefail
          cat ci/omniscribe.part* > /tmp/omniscribe.b64
          base64 --decode /tmp/omniscribe.b64 > /tmp/omniscribe.zip
          unzip -t /tmp/omniscribe.zip
          rm -rf omniscribe
          mkdir -p omniscribe
          unzip -q /tmp/omniscribe.zip -d omniscribe
          test -f omniscribe/app/build.gradle
          test -f omniscribe/scripts/fetch-whisper.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Fetch whisper.cpp
        working-directory: omniscribe
        shell: bash
        run: bash scripts/fetch-whisper.sh

      - name: Build installable arm64 APK
        working-directory: omniscribe
        shell: bash
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and name APK
        shell: bash
        run: |
          set -euo pipefail
          APK="omniscribe/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" OmniScribe-v1.1-arm64.apk
          sha256sum OmniScribe-v1.1-arm64.apk | tee OmniScribe-v1.1-arm64.apk.sha256
          unzip -t OmniScribe-v1.1-arm64.apk

      - name: Publish temporary OmniScribe release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" OmniScribe-v1.1-arm64.apk OmniScribe-v1.1-arm64.apk.sha256 --clobber
            gh release edit "$RELEASE_TAG" --title 'OmniScribe v1.1 ARM64 APK' --notes 'Temporary CI release for the OmniScribe Android APK build.'
          else
            gh release create "$RELEASE_TAG" OmniScribe-v1.1-arm64.apk OmniScribe-v1.1-arm64.apk.sha256 --title 'OmniScribe v1.1 ARM64 APK' --notes 'Temporary CI release for the OmniScribe Android APK build.'
          fi

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          SHA="$(cat OmniScribe-v1.1-arm64.apk.sha256)"
          gh issue comment "${{ github.event.issue.number }}" --body "OMNISCRIBE_BUILD_SUCCESS run_id=${{ github.run_id }} release=https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG checksum=$SHA"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh issue comment "${{ github.event.issue.number }}" --body "OMNISCRIBE_BUILD_FAILED run_id=${{ github.run_id }} run=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

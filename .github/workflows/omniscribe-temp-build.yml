name: Temporary OmniScribe APK Builder

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

env:
  BUILD_ISSUE_TITLE: '[CI] Build OmniScribe v1.2.0 arm64'
  RELEASE_TAG: omniscribe-v1.2.0-ci

jobs:
  build:
    if: github.event.issue.title == '[CI] Build OmniScribe v1.2.0 arm64'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out isolated OmniScribe build branch
        uses: actions/checkout@v4
        with:
          ref: build/omniscribe-v1.1

      - name: Reconstruct OmniScribe v1.2 source
        shell: bash
        run: |
          set -euo pipefail
          cat ci/omniscribe.part* > /tmp/omniscribe.b64
          base64 --decode /tmp/omniscribe.b64 > /tmp/omniscribe.zip
          rm -rf omniscribe
          mkdir -p omniscribe
          unzip -q /tmp/omniscribe.zip -d omniscribe || true
          cp ci/WhisperEngine.java omniscribe/app/src/main/java/com/vaanhanma/omniscribe/engine/WhisperEngine.java
          cp ci/TranscriptExporter.java omniscribe/app/src/main/java/com/vaanhanma/omniscribe/engine/TranscriptExporter.java
          cp ci/FfmpegRunner.java omniscribe/app/src/main/java/com/vaanhanma/omniscribe/engine/FfmpegRunner.java
          cp ci/AndroidAudioDecoder.java omniscribe/app/src/main/java/com/vaanhanma/omniscribe/engine/AndroidAudioDecoder.java
          cp ci/app-build.gradle omniscribe/app/build.gradle
          python3 ci/patch-v12.py
          grep -q "versionName '1.2.0'" omniscribe/app/build.gradle
          grep -q 'AndroidAudioDecoder' omniscribe/app/src/main/java/com/vaanhanma/omniscribe/service/BatchService.java
          grep -q 'Decoding speech with Android' omniscribe/app/src/main/java/com/vaanhanma/omniscribe/service/BatchService.java
          grep -q 'keeping original audio' omniscribe/app/src/main/java/com/vaanhanma/omniscribe/service/BatchService.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Fetch whisper.cpp
        working-directory: omniscribe
        shell: bash
        run: bash scripts/fetch-whisper.sh

      - name: Build installable arm64 APK
        working-directory: omniscribe
        shell: bash
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify v1.2 architecture and APK
        shell: bash
        run: |
          set -euo pipefail
          APK="omniscribe/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | tee /tmp/apk-files.txt
          grep -q 'classes.dex' /tmp/apk-files.txt
          grep -q 'lib/arm64-v8a/libomniscribe_whisper.so' /tmp/apk-files.txt
          grep -q 'lib/arm64-v8a/libc++_shared.so' /tmp/apk-files.txt
          cp "$APK" OmniScribe-v1.2.0-arm64.apk
          sha256sum OmniScribe-v1.2.0-arm64.apk | tee OmniScribe-v1.2.0-arm64.apk.sha256

      - name: Upload OmniScribe Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniScribe-v1.2.0-arm64
          path: |
            OmniScribe-v1.2.0-arm64.apk
            OmniScribe-v1.2.0-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish temporary OmniScribe release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES='v1.2 moves transcription decoding to Android MediaExtractor/MediaCodec first, so transcript jobs no longer depend on the external FFmpeg executable. FFmpeg remains an optional conversion helper; if conversion fails, OmniScribe keeps the original downloaded audio instead of killing the whole job.'
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" OmniScribe-v1.2.0-arm64.apk OmniScribe-v1.2.0-arm64.apk.sha256 --clobber
            gh release edit "$RELEASE_TAG" --title 'OmniScribe v1.2.0 ARM64 APK' --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" OmniScribe-v1.2.0-arm64.apk OmniScribe-v1.2.0-arm64.apk.sha256 --title 'OmniScribe v1.2.0 ARM64 APK' --notes "$NOTES"
          fi

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          SHA="$(cat OmniScribe-v1.2.0-arm64.apk.sha256)"
          gh issue comment "${{ github.event.issue.number }}" --body "OMNISCRIBE_BUILD_SUCCESS run_id=${{ github.run_id }} release=https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG checksum=$SHA android_native_decode=source_verified audio_conversion_fallback=source_verified apk_integrity=verified"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh issue comment "${{ github.event.issue.number }}" --body "OMNISCRIBE_BUILD_FAILED run_id=${{ github.run_id }} run=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
